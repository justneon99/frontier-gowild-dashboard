ondary" data-zh="生成邀请链接" data-en="Create invitation link">生成邀请链接</button></form><p id="admin-message" class="muted" role="status"></p><div id="invite-result" hidden><label><span data-zh="一次性邀请链接 · 仅此处显示" data-en="One-time invitation link · shown only here">一次性邀请链接 · 仅此处显示</span><input id="invite-link" readonly></label><button type="button" id="copy-invite" class="secondary" data-zh="复制链接" data-en="Copy link">复制链接</button></div><div id="admin-summary" class="admin-summary"></div><h3 data-zh="账号" data-en="Accounts">账号</h3><div id="admin-users" class="admin-list"></div><h3 data-zh="邀请记录" data-en="Invitations">邀请记录</h3><div id="admin-invitations" class="admin-list"></div><p class="disclaimer" data-zh="撤销访问不会删除历史记录；已下载到个人日历的提醒需本人自行移除。" data-en="Revoking access keeps history. Recipients must remove reminders already added to their calendars themselves.">撤销访问不会删除历史记录；已下载到个人日历的提醒需本人自行移除。</p></div></section></main></body></html>
