<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理 · Frontier GoWild 航班雷达</title><link rel="stylesheet" href="app.css?v=20260929-atl-tpa-admin"><script type="module" src="admin.mjs?v=20260929-atl-tpa-admin"></script></head><body><header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="./">Frontier GoWild 航班雷达</a><nav><a href="./" data-zh="返回航班雷达" data-en="Back to Flight Radar">返回航班雷达</a><button type="button" id="lang" class="text-button">English</button></nav></div></header><main class="wrap admin-page"><section class="search-panel"><h1 data-zh="管理中心" data-en="Admin center">管理中心</h1><p data-zh="管理访问权限、账号和邀请。" data-en="Manage access, accounts, and invitations.">管理访问权限、账号和邀请。</p><form id="admin-login"><label><span data-zh="管理员邮箱" data-en="Admin email">管理员邮箱</span><input id="login-email" type="email" autocomplete="email" required placeholder="you@example.com"></label><button class="secondary" type="submit" data-zh="发送登录链接" data-en="Email sign-in link">发送登录链接</button></form><p id="login-message" role="status"></p><div id="admin-session" hidden><span id="user-email"></span><button type="button" id="sign-out" class="text-button" data-zh="退出" data-en="Sign out">退出</button></div></section><section class="trip-panel admin-panel" id="admin"><div id="admin-gate" class="status-box"></div><div id="admin-content" hidden><div class="section-heading"><div><div class="section-label"><span class="section-num">A</span><span data-zh="管理员" data-en="Admin">管理员</span></div><h2 data-zh="账号与邀请" data-en="Accounts & invitations">账号与邀请</h2><p data-zh="查看账号状态、发送一次性邀请，或撤销账号访问。撤销后该账号无法登录，未来邮件提醒停止。" data-en="Review account status, send one-time invitations, or revoke access. Revoked accounts cannot sign in and future email reminders stop.">查看账号状态、发送一次性邀请，或撤销账号访问。撤销后该账号无法登录，未来邮件提醒停止。</p></div></div><form id="admin-invite-form" class="admin-invite-form"><label><span data-zh="邀请邮箱" data-en="Invite email">邀请邮箱</span><input id="admin-invite-email" type="email" autocomplete="off" placeholder="friend@example.com" required></label><button type="submit" class="secondary" data-zh="发送邀请" data-en="Send invitation">发送邀请</button></form><p id="admin-message" class="muted" role="status"></p><div id="admin-summary" class="admin-summary"></div><h3 data-zh="账号" data-en="Accounts">账号</h3><div id="admin-users" class="admin-list"></div><h3 data-zh="邀请记录" data-en="Invitations">邀请记录</h3><div id="admin-invitations" class="admin-list"></div><p class="disclaimer" data-zh="撤销访问不会删除历史记录；已加入个人日历的事件可能仍需收件人自行移除。" data-en="Revoking access keeps history. Recipients may need to remove events already added to their calendars.">撤销访问不会删除历史记录；已加入个人日历的事件可能仍需收件人自行移除。</p></div></section></main></body></html>
